<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>釜山慶州 秋季自由行</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --primary: #c2410c;       
      --primary-light: #ffedd5; 
      --accent: #b45309;        
      --bg: #faf6f0;            
      --surface: #ffffff;
      --text: #292524;          
      --text-muted: #78716c;    
      --border: #e7e5e4;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      margin: 0; background-color: var(--bg); color: var(--text); overflow: hidden;
      perspective: 1500px;
    }

    /* 💻 電腦與手機通用：全螢幕滿版，限制最大閱讀寬度 1000px 並置中，視覺最舒服 */
    .screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg); overflow-y: auto; overflow-x: hidden;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 10;
      max-width: 1000px;
      margin: 0 auto;
      box-shadow: 0 0 50px rgba(0,0,0,0.08);
    }
    
    @media (max-width: 1000px) {
      .screen { max-width: 100%; box-shadow: none; }
    }

    /* ================= 3D 翻書封面 ================= */
    .cover-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(180deg, rgba(67, 36, 22, 0.25) 0%, rgba(67, 36, 22, 0.95) 100%),
                  url('https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=1600&q=80') center/cover;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 60px 24px 100px; 
      transform-origin: left center;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.6s;
      backface-visibility: hidden;
    }
    .cover-screen.hide {
      transform: rotateY(-110deg);
      opacity: 0; pointer-events: none;
    }
    .cover-title { color: white; text-align: center; margin-bottom: 60px; }
    .cover-title h1 { font-size: 4rem; font-weight: 900; margin: 0 0 10px; letter-spacing: 6px; font-family: 'Plus Jakarta Sans', sans-serif;}
    .cover-title p { font-size: 1.35rem; opacity: 0.95; margin: 0; font-weight: 700; letter-spacing: 2px;}
    .cover-btn {
      background: var(--surface); color: var(--primary);
      border: none; border-radius: 999px; padding: 20px 50px;
      font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); cursor: pointer; transition: 0.2s;
    }
    .cover-btn:hover { transform: scale(1.05); }
    .cover-btn:active { transform: scale(0.95); }

    #screen-home { z-index: 1; transform: translateX(0); padding-bottom: 120px; }
    #screen-list { z-index: 2; transform: translateX(100%); background-color: var(--bg); padding-bottom: 120px;}
    #screen-detail { z-index: 3; transform: translateX(100%); background-color: var(--surface); padding-bottom: 120px;}
    .screen.active { transform: translateX(0) !important; }

    /* ================= 首頁設計 ================= */
    .hero {
      position: relative; height: 340px;
      background: linear-gradient(180deg, rgba(67, 36, 22, 0.4) 0%, rgba(67, 36, 22, 0.9) 100%), 
                  url('https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=1600&q=80') center/cover;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 45px; color: white;
      border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg);
      box-shadow: 0 10px 30px rgba(194, 65, 12, 0.15);
    }
    .hero-badge {
      display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(8px);
      padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; width: fit-content;
    }
    .hero h1 { font-size: 2.6rem; font-weight: 800; margin: 0 0 8px 0; }
    .hero p { margin: 0; font-size: 1.1rem; opacity: 0.9; }

    .section-title { font-size: 1.3rem; font-weight: 800; color: var(--text); margin: 40px 40px 18px; display: flex; align-items: center; gap: 10px; }
    .home-menu { padding: 0 40px; display: flex; flex-direction: column; gap: 16px; }
    .menu-card {
      background: var(--surface); border-radius: var(--radius-md); padding: 22px 26px;
      display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.1); cursor: pointer; transition: 0.2s;
    }
    .menu-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px -3px rgba(194, 65, 12, 0.15); }
    .menu-card:active { transform: scale(0.98); background: #f5f5f4; }
    .menu-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
    .menu-info { flex: 1; }
    .menu-date { font-size: 0.85rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .menu-title { font-size: 1.25rem; font-weight: 800; color: var(--text); }
    .menu-arrow { color: #a8a29e; font-size: 1.4rem; }

    .menu-card.buy .menu-icon { background: #fefce8; color: #a16207; }
    .menu-card.buy .menu-date { color: #a16207; }
    .menu-card.beauty .menu-icon { background: #fdf2f8; color: #be185d; }
    .menu-card.beauty .menu-date { color: #be185d; }

    /* ================= 列表頁 ================= */
    .header-bar {
      position: sticky; top: 0; z-index: 50; background: rgba(250, 246, 240, 0.92); backdrop-filter: blur(16px);
      padding: 24px 40px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; gap: 16px;
    }
    .back-btn { width: 46px; height: 46px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s;}
    .back-btn:hover { background: #f5f5f4; transform: scale(1.05); }
    .header-title { font-size: 1.5rem; font-weight: 800; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-container { padding: 40px; }

    .alert-card {
      background: linear-gradient(135deg, #fefce8 0%, #fef08a 100%); border: 1px solid #fde047; border-radius: var(--radius-md);
      padding: 22px; margin-bottom: 30px; display: flex; gap: 16px; box-shadow: 0 4px 15px rgba(202, 138, 4, 0.1);
    }
    .alert-icon { font-size: 1.8rem; color: #a16207; flex-shrink: 0; }
    .alert-text { font-size: 1rem; color: #713f12; line-height: 1.6; }
    .alert-text b { color: #854d0e; }

    .timeline { position: relative; padding-left: 36px; }
    .timeline::before { content: ''; position: absolute; top: 20px; bottom: 20px; left: 14px; width: 3px; background: #e7e5e4; border-radius: 2px; }
    .t-item { position: relative; margin-bottom: 20px; opacity: 0; transform: translateY(15px); animation: fadeInUp 0.4s forwards; }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .t-dot { position: absolute; left: -30px; top: 26px; width: 14px; height: 14px; border-radius: 50%; background: white; border: 3px solid var(--primary); z-index: 2; }
    .t-card { background: var(--surface); border-radius: var(--radius-md); padding: 22px 26px; box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.08); cursor: pointer; display: flex; align-items: center; gap: 20px; border: 1px solid transparent; transition: 0.2s; }
    .t-card:hover { border-color: var(--border); box-shadow: 0 8px 25px -3px rgba(120, 113, 108, 0.12); }
    .t-card:active { transform: scale(0.98); }
    .t-card.task { border-color: #fca5a5; box-shadow: 0 4px 15px -3px rgba(239, 68, 68, 0.15); }
    .t-time { font-size: 1.1rem; font-weight: 800; color: var(--primary); width: 65px; flex-shrink: 0; }
    .t-info { flex: 1; }
    .t-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
    .t-sub { font-size: 0.95rem; color: var(--text-muted); line-height: 1.4; }
    .t-card i.arrow { color: #d6d3d1; font-size: 1.4rem; }

    /* ================= 詳情頁 ================= */
    .detail-cover { width: 100%; height: 400px; object-fit: cover; background: #e7e5e4; }
    .detail-body { padding: 45px; background: var(--surface); border-top-left-radius: 32px; border-top-right-radius: 32px; margin-top: -36px; position: relative; z-index: 5; min-height: calc(100vh - 364px); }
    .d-tag { display: inline-block; padding: 6px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; margin-bottom: 16px; }
    .d-title { font-size: 2.2rem; font-weight: 800; margin: 0 0 20px 0; line-height: 1.3; }
    .d-desc { font-size: 1.15rem; color: #44403c; line-height: 1.9; margin-bottom: 35px; white-space: pre-line; }
    
    .action-row { display: flex; flex-direction: column; gap: 16px; margin-top: auto; padding-bottom: 60px; }
    .btn-large { width: 100%; padding: 20px; border-radius: 16px; font-size: 1.15rem; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 12px; border: none; cursor: pointer; text-decoration: none; transition: 0.2s; }
    .btn-nav { background: #047857; color: white; box-shadow: 0 4px 15px rgba(4, 120, 87, 0.3); }
    .btn-nav:hover { background: #065f46; transform: translateY(-2px); }
    .btn-web { background: #2563eb; color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
    .btn-web:hover { background: #1d4ed8; transform: translateY(-2px); }
    .btn-cp { background: #f5f5f4; color: #44403c; border: 1px solid #d6d3d1; }
    .btn-cp:hover { background: #e7e5e4; transform: translateY(-2px); }

    #toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(41, 37, 36, 0.95); color: white; padding: 14px 28px; border-radius: 999px; font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 10px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 999; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- ================= 3D 翻書封面 ================= -->
  <div id="screen-cover" class="cover-screen">
    <div class="cover-title">
      <h1>BUSAN</h1>

  const typeMap = {
    food: { color: '#c2410c', bg: '#ffedd5', label: '美食' },
    spot: { color: '#b45309', bg: '#fef3c7', label: '景點' },
    task: { color: '#be123c', bg: '#ffe4e6', label: '重要' },
    shop: { color: '#854d0e', bg: '#fef08a', label: '購物' },
    traffic: { color: '#78716c', bg: '#f5f5f4', label: '交通' },
    hotel: { color: '#9a3412', bg: '#ffedd5', label: '住宿' }
  };

  function enterApp() {
    document.getElementById('screen-cover').classList.add('hide');
  }

  function openList(id) {
    currentListId = id;
    const data = db[id];
    document.getElementById('list-header-title').innerText = data.title;
    const alertBox = document.getElementById('listAlert');
    if (data.alert) { alertBox.style.display = 'flex'; alertBox.innerHTML = `<i class="ph-fill ph-warning-circle alert-icon"></i><div class="alert-text">${data.alert}</div>`; } 
    else { alertBox.style.display = 'none'; }

    const container = document.getElementById('listContent');
    container.innerHTML = '';
    
    data.items.forEach((item, index) => {
      const typeCfg = typeMap[item.type] || typeMap.traffic;
      const isTask = item.type === 'task' ? 'task' : '';
      const clickable = (item.img || item.desc || item.kr || item.map || item.web) ? `onclick="openDetail('${id}',${index})"` : '';
      const arrowIcon = clickable ? `<i class="ph-bold ph-caret-right arrow"></i>` : ``;

      const html = `
        <div class="t-item" style="animation-delay: ${index * 0.05}s">
          <div class="t-dot" style="border-color: ${typeCfg.color}"></div>
          <div class="t-card ${isTask}" ${clickable}>
            <div class="t-time" style="color: ${typeCfg.color}">${item.time}</div>
            <div class="t-info"><div class="t-title">${item.title}</div><div class="t-sub">${item.sub}</div></div>
            ${arrowIcon}
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', html);
    });

    document.getElementById('screen-list').classList.add('active');
    document.getElementById('screen-list').scrollTo(0,0);
  }

  function openDetail(dayId, itemIndex) {
    const item = db[dayId].items[itemIndex];
    const typeCfg = typeMap[item.type] || typeMap.traffic;

    const imgEl = document.getElementById('detail-img');
    if(item.img) { imgEl.src = item.img; imgEl.style.display = 'block'; } else { imgEl.style.display = 'none'; }

    const tagEl = document.getElementById('detail-tag');
    tagEl.innerText = typeCfg.label; tagEl.style.backgroundColor = typeCfg.bg; tagEl.style.color = typeCfg.color;

    document.getElementById('detail-title').innerText = item.title;
    document.getElementById('detail-desc').innerHTML = item.desc || '';

    const actionsBox = document.getElementById('detail-actions');
    actionsBox.innerHTML = '';
    if(item.web) actionsBox.innerHTML += `<a href="${item.web}" target="_blank" class="btn-large btn-web"><i class="ph-fill ph-globe"></i> 官方無人機秀資訊網站</a>`;
    if(item.map) actionsBox.innerHTML += `<a href="${item.map}" target="_blank" class="btn-large btn-nav"><i class="ph-fill ph-map-pin"></i> 開啟 NAVER 導航</a>`;
    if(item.kr) actionsBox.innerHTML += `<button class="btn-large btn-cp" onclick="copyText('${item.kr}')"><i class="ph-bold ph-copy"></i> 複製韓文：${item.kr}</button>`;

    document.getElementById('screen-detail').classList.add('active');
    document.getElementById('screen-detail').scrollTo(0,0);
  }

  function backToHome() { document.getElementById('screen-list').classList.remove('active'); }
  function backToList() { document.getElementById('screen-detail').classList.remove('active'); }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = `已複製：${text}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });
  }
</script>

</html>
