<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>釜山慶州 秋季旅遊手冊</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --primary: #c2410c;       
      --primary-light: #ffedd5; 
      --accent: #b45309;        
      --bg: #292524;            /* 書桌深色背景襯托手冊質感 */
      --book-bg: #faf6f0;       /* 內頁米色紙張色 */
      --surface: #ffffff;
      --text: #292524;          
      --text-muted: #78716c;    
      --border: #e7e5e4;
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; scroll-behavior: smooth; }
    
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      margin: 0; background-color: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
      perspective: 2000px; padding: 20px 0;
    }

    /* 📘 模擬實體旅遊手冊的外觀與書背陰影 */
    .travel-book {
      position: relative;
      width: 100%; max-width: 950px;
      background-color: var(--book-bg);
      min-height: 96vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 15px 0 30px rgba(0,0,0,0.03);
      overflow: hidden;
    }

    /* ================= 3D 翻書封面 ================= */
    .book-cover {
      position: absolute; inset: 0; z-index: 9999;
      background: linear-gradient(180deg, rgba(67, 36, 22, 0.3) 0%, rgba(67, 36, 22, 0.9) 100%),
                  url('https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=1600&q=80') center/cover;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 60px 40px 100px;
      transform-origin: left center;
      transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.7s;
      backface-visibility: hidden;
    }
    .book-cover.hide {
      transform: rotateY(-110deg);
      opacity: 0; pointer-events: none;
    }
    .cover-title { color: white; text-align: center; margin-bottom: 60px; }
    .cover-title h1 { font-size: 4rem; font-weight: 900; margin: 0 0 10px; letter-spacing: 6px; font-family: 'Plus Jakarta Sans', sans-serif;}
    .cover-title p { font-size: 1.35rem; opacity: 0.95; margin: 0; font-weight: 700; letter-spacing: 2px;}
    .cover-btn {
      background: var(--surface); color: var(--primary);
      border: none; border-radius: 999px; padding: 20px 50px;
      font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4); cursor: pointer; transition: 0.2s;
    }
    .cover-btn:hover { transform: scale(1.05); }
    .cover-btn:active { transform: scale(0.95); }

    /* 手冊封面內頁裝飾 */
    .book-header {
      position: relative; height: 320px;
      background: linear-gradient(180deg, rgba(67, 36, 22, 0.4) 0%, rgba(67, 36, 22, 0.85) 100%), 
                  url('https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=1600&q=80') center/cover;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 45px; color: white;
      border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg);
      box-shadow: 0 10px 30px rgba(194, 65, 12, 0.15);
    }
    .book-badge {
      display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(8px);
      padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; width: fit-content;
    }
    .book-header h1 { font-size: 2.5rem; font-weight: 800; margin: 0 0 8px 0; }
    .book-header p { margin: 0; font-size: 1.05rem; opacity: 0.9; }

    /* 頂部索引導覽列 */
    .index-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(250, 246, 240, 0.92); backdrop-filter: blur(12px);
      padding: 15px 35px; border-bottom: 1px solid var(--border);
      display: flex; gap: 10px; overflow-x: auto; white-space: nowrap;
    }
    .index-btn {
      background: var(--surface); color: var(--text); padding: 8px 16px; border-radius: 999px;
      font-size: 0.9rem; font-weight: 700; text-decoration: none; border: 1px solid var(--border);
      transition: 0.2s; cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .index-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

    /* 內頁主區域 */
    .book-body { padding: 40px; }

    /* 天數區塊 */
    .day-section { margin-bottom: 60px; scroll-margin-top: 70px; }
    .day-header {
      display: flex; align-items: center; gap: 14px; margin-bottom: 24px;
      padding-bottom: 12px; border-bottom: 2px solid var(--primary-light);
    }
    .day-icon {
      width: 48px; height: 48px; border-radius: 14px; background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0;
    }
    .day-title-group h2 { margin: 0 0 4px 0; font-size: 1.5rem; font-weight: 800; color: var(--text); }
    .day-title-group p { margin: 0; font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }

    /* 注意事項卡片 */
    .alert-box {
      background: linear-gradient(135deg, #fefce8 0%, #fef08a 100%); border: 1px solid #fde047;
      border-radius: var(--radius-md); padding: 18px 22px; margin-bottom: 24px;
      display: flex; gap: 14px; align-items: flex-start; box-shadow: 0 4px 12px rgba(202, 138, 4, 0.08);
    }
    .alert-box i { font-size: 1.4rem; color: #a16207; margin-top: 2px; flex-shrink: 0; }
    .alert-box div { font-size: 0.95rem; color: #713f12; line-height: 1.5; }
    .alert-box b { color: #854d0e; }

    /* 行程時間軸卡片 */
    .timeline-grid { display: flex; flex-direction: column; gap: 16px; }
    .t-card {
      background: var(--surface); border-radius: var(--radius-md); padding: 20px 24px;
      display: flex; gap: 20px; align-items: flex-start; border: 1px solid var(--border);
      box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.06); transition: 0.2s; position: relative;
    }
    .t-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); border-color: #cbd5e1; }
    .t-card.task-card { border-color: #fca5a5; background: #fff1f2; }

    .t-time { font-size: 1rem; font-weight: 800; color: var(--primary); width: 60px; flex-shrink: 0; padding-top: 2px; }
    .t-content { flex: 1; }
    .t-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    .t-sub { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px; }
    .t-desc { font-size: 0.95rem; color: #44403c; line-height: 1.6; margin-bottom: 14px; white-space: pre-line; }

    /* 按鈕群組 */
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .action-btn {
      padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none; border: none; cursor: pointer; transition: 0.2s;
    }
    .btn-nav { background: #047857; color: white; }
    .btn-nav:hover { background: #065f46; }
    .btn-web { background: #2563eb; color: white; }
    .btn-web:hover { background: #1d4ed8; }
    .btn-cp { background: var(--book-bg); color: var(--text); border: 1px solid var(--border); }
    .btn-cp:hover { background: #f5f5f4; }

    /* 購物專區 (4欄精簡整合) */
    .shopping-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .shop-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.06); display: flex; flex-direction: column; }
    .shop-card h3 { margin: 0 0 6px 0; font-size: 1.2rem; color: var(--primary); }
    
    .add-item-row { display: flex; gap: 8px; margin-top: 12px; margin-bottom: 16px; }
    .add-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: var(--book-bg); }
    .add-btn { background: var(--primary); color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .add-btn:hover { background: #9a3412; }

    .item-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .item-row { display: flex; align-items: center; justify-content: space-between; background: var(--book-bg); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; }
    .item-delete { color: #dc2626; background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 4px; }
    .item-delete:hover { background: #fee2e2; }

    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(41, 37, 36, 0.95); color: white; padding: 12px 24px; border-radius: 999px;
      font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 8px;
      opacity: 0.9; pointer-events: none; transition: all 0.3s; z-index: 999;
    }

    @media (max-width: 768px) {
      body { padding: 0; }
      .travel-book { border-radius: 0; min-height: 100vh; box-shadow: none; }
      .book-header { height: 280px; padding: 25px; }
      .book-header h1 { font-size: 2rem; }
      .book-body { padding: 20px; }
    }
  </style>
</head>

      `;

      if(cat.items.length === 0) {
        html += `<div style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:15px;">目前沒有商品，快來新增吧！</div>`;
      } else {
        cat.items.forEach((itemText, itemIdx) => {
          html += `
            <div class="item-row">
              <span>${itemText}</span>
              <button class="item-delete" onclick="deleteItem(${catIdx}, ${itemIdx})"><i class="ph-bold ph-trash"></i></button>
            </div>
          `;
        });
      }

      html += `</div></div>`;
    });

    html += `</div></div>`;
    container.innerHTML = html;
  }

  // 智慧 AI 分類邏輯 (4個分類)
  function classifyItem(text) {
    const t = text.toLowerCase();
    if (t.includes('美妝') || t.includes('防曬') || t.includes('粉底') || t.includes('眼影') || t.includes('洗面乳') || t.includes('精華') || t.includes('霜') || t.includes('蜜粉') || t.includes('筆') || t.includes('唇') || t.includes('男友') || t.includes('素顏霜') || t.includes('男') || t.includes('化妝水')) return 3; // 美妝與男友代買
    if (t.includes('慶州') || t.includes('皇南餅') || t.includes('十元') || t.includes('麵包') || t.includes('瞻星臺') || t.includes('明信片')) return 1; // 慶州限定
    if (t.includes('水果') || t.includes('葡萄') || t.includes('桃') || t.includes('海苔') || t.includes('小菜')) return 2; // 水果市場
    return 0; // 超市零食
  }

  function addItem(catIdx) {
    const input = document.getElementById(`input-${catIdx}`);
    const val = input.value.trim();
    if(!val) return;

    const targetIdx = classifyItem(val);
    shoppingCategories[targetIdx].items.push(val);
    
    input.value = '';
    saveAndRender();
  }

  function handleKeyPress(e, catIdx) {
    if (e.key === 'Enter') {
      addItem(catIdx);
    }
  }

  function deleteItem(catIdx, itemIdx) {
    shoppingCategories[catIdx].items.splice(itemIdx, 1);
    saveAndRender();
  }

  function saveAndRender() {
    localStorage.setItem('busan_shopping_list', JSON.stringify(shoppingCategories));
    renderBook();
  }

  function openBook() {
    document.getElementById('bookCover').classList.add('hide');
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = `已複製：${text}`;
      toast.style.display = 'flex';
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.style.display = 'none', 300);
      }, 2000);
    });
  }

  // 初始化執行
  renderBook();
</script>
</body>
</html>
