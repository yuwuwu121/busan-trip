<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>釜山慶州 秋季旅遊手冊</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --primary: #c2410c;       
      --primary-light: #ffedd5; 
      --accent: #b45309;        
      --bg: #faf6f0;            
      --surface: #ffffff;
      --text: #292524;          
      --text-muted: #78716c;    
      --border: #e7e5e4;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      margin: 0; background-color: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
      padding: 0;
    }

    .app-container {
      position: relative;
      width: 100%; max-width: 900px;
      background-color: var(--bg);
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(0,0,0,0.05);
    }

    .page {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
      padding-bottom: 80px;
    }
    .page.active {
      display: block;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* 頂部封面 Hero */
    .hero {
      position: relative; height: 320px;
      background: linear-gradient(180deg, rgba(67, 36, 22, 0.4) 0%, rgba(67, 36, 22, 0.9) 100%), 
                  url('https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=1600&q=80') center/cover;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 35px; color: white;
      border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg);
      box-shadow: 0 10px 30px rgba(194, 65, 12, 0.15);
    }
    .hero-badge {
      display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(8px);
      padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; width: fit-content;
    }
    .hero h1 { font-size: 2.2rem; font-weight: 800; margin: 0 0 6px 0; }
    .hero p { margin: 0; font-size: 1rem; opacity: 0.9; }

    .section-title { font-size: 1.2rem; font-weight: 800; color: var(--text); margin: 30px 24px 14px; display: flex; align-items: center; gap: 8px; }
    .home-menu { padding: 0 24px 20px; display: flex; flex-direction: column; gap: 14px; }
    .menu-card {
      background: var(--surface); border-radius: var(--radius-md); padding: 20px;
      display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.1); cursor: pointer; transition: 0.2s;
    }
    .menu-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px -3px rgba(194, 65, 12, 0.15); }
    .menu-card:active { transform: scale(0.98); background: #f5f5f4; }
    .menu-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0; }
    .menu-info { flex: 1; }
    .menu-date { font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .menu-title { font-size: 1.15rem; font-weight: 800; color: var(--text); }
    .menu-arrow { color: #a8a29e; font-size: 1.2rem; }

    .menu-card.buy .menu-icon { background: #fefce8; color: #a16207; }
    .menu-card.buy .menu-date { color: #a16207; }

    /* 頂部導覽列 */
    .header-bar {
      position: sticky; top: 0; z-index: 50; background: rgba(250, 246, 240, 0.92); backdrop-filter: blur(16px);
      padding: 18px 24px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; gap: 14px;
    }
    .back-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; }
    .back-btn:hover { background: #f5f5f4; transform: scale(1.05); }
    .header-title { font-size: 1.3rem; font-weight: 800; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-container { padding: 24px; }

    .alert-card {
      background: linear-gradient(135deg, #fefce8 0%, #fef08a 100%); border: 1px solid #fde047; border-radius: var(--radius-md);
      padding: 18px; margin-bottom: 24px; display: flex; gap: 14px; box-shadow: 0 4px 12px rgba(202, 138, 4, 0.1);
    }
    .alert-icon { font-size: 1.5rem; color: #a16207; flex-shrink: 0; }
    .alert-text { font-size: 0.9rem; color: #713f12; line-height: 1.5; }
    .alert-text b { color: #854d0e; }

    .timeline { position: relative; padding-left: 32px; }
    .timeline::before { content: ''; position: absolute; top: 20px; bottom: 20px; left: 12px; width: 2px; background: #e7e5e4; border-radius: 2px; }
    .t-item { position: relative; margin-bottom: 16px; }
    .t-dot { position: absolute; left: -27px; top: 24px; width: 12px; height: 12px; border-radius: 50%; background: white; border: 3px solid var(--primary); z-index: 2; }
    .t-card { background: var(--surface); border-radius: var(--radius-md); padding: 18px 22px; box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.08); display: flex; align-items: center; gap: 16px; border: 1px solid transparent; cursor: pointer; transition: 0.2s; }
    .t-card:hover { border-color: var(--border); box-shadow: 0 6px 20px -3px rgba(120, 113, 108, 0.12); }
    .t-card.task { border-color: #fca5a5; box-shadow: 0 4px 15px -3px rgba(239, 68, 68, 0.15); }
    .t-time { font-size: 0.95rem; font-weight: 800; color: var(--primary); width: 55px; flex-shrink: 0; }
    .t-info { flex: 1; }
    .t-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .t-sub { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

    /* 詳情頁 */
    .detail-back-icon {
      position: absolute; top: 20px; left: 20px; z-index: 50;
      width: 42px; height: 42px; border-radius: 50%; background: white;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15); cursor: pointer;
      font-size: 1.2rem; color: #292524; transition: 0.2s;
    }
    .detail-back-icon:hover { transform: scale(1.05); background: #f5f5f4; }
    .detail-cover { width: 100%; height: 320px; object-fit: cover; background: #e7e5e4; }
    .detail-body { padding: 30px; background: var(--surface); border-top-left-radius: 24px; border-top-right-radius: 24px; margin-top: -24px; position: relative; z-index: 5; }
    .d-tag { display: inline-block; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; margin-bottom: 12px; }
    .d-title { font-size: 1.6rem; font-weight: 800; margin: 0 0 16px 0; line-height: 1.3; }
    .d-desc { font-size: 1rem; color: #44403c; line-height: 1.8; margin-bottom: 30px; white-space: pre-line; }

    .action-row { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .btn-large { width: 100%; padding: 18px; border-radius: 14px; font-size: 1.05rem; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 10px; border: none; cursor: pointer; text-decoration: none; transition: 0.2s; }
    .btn-nav { background: #047857; color: white; }
    .btn-nav:hover { background: #065f46; }
    .btn-web { background: #2563eb; color: white; }
    .btn-web:hover { background: #1d4ed8; }
    .btn-cp { background: #f5f5f4; color: #44403c; border: 1px solid #d6d3d1; }
    .btn-cp:hover { background: #e7e5e4; }

    /* 單一大清單與新增欄位設計 */
    .add-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 24px; box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.08); }
    .add-input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: var(--bg); margin-bottom: 10px; font-family: inherit; }
    .add-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .add-btn:hover { background: #9a3412; }

    .single-shop-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.08); }
    .single-shop-card h3 { margin: 0 0 16px 0; font-size: 1.2rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    
    .shopping-item-grid { display: flex; flex-direction: column; gap: 12px; max-height: 500px; overflow-y: auto; }
    .shop-item-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); gap: 12px; }
    .shop-item-info { display: flex; align-items: center; gap: 14px; flex: 1; }
    .shop-item-thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #e7e5e4; flex-shrink: 0; }
    .shop-item-name { font-size: 1rem; font-weight: 700; color: var(--text); }
    .shop-item-delete { color: #dc2626; background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 4px 8px; border-radius: 6px; }
    .shop-item-delete:hover { background: #fee2e2; }

    #toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(41, 37, 36, 0.95); color: white; padding: 12px 24px; border-radius: 999px; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 8px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 999; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- ================= 首頁 ================= -->
    <div id="page-home" class="page active">
      <header class="hero">
        <div class="hero-badge">🍁 釜山 ✕ 慶州</div>
        <h1>秋季自由行</h1>
        <p>廣安里無人機秀 • 千年慶州花海 • 釜山塔與味讚王</p>
      </header>

      <div class="section-title"><i class="ph-bold ph-calendar-check"></i> 行程總覽</div>
      <div class="home-menu">
        <div class="menu-card" onclick="openDay('d1')">
          <div class="menu-icon"><i class="ph-fill ph-airplane-landing"></i></div>
          <div class="menu-info"><div class="menu-date">10/10 (六)</div><div class="menu-title">廣安海景與無人機秀</div></div>
          <i class="ph-bold ph-caret-right menu-arrow"></i>
        </div>
        <div class="menu-card" onclick="openDay('d2')">
          <div class="menu-icon"><i class="ph-fill ph-palette"></i></div>
          <div class="menu-info"><div class="menu-date">10/11 (日)</div><div class="menu-title">傳統市場與光影展</div></div>
          <i class="ph-bold ph-caret-right menu-arrow"></i>
        </div>
        <div class="menu-card" onclick="openDay('d3')">
          <div class="menu-icon"><i class="ph-fill ph-waves"></i></div>
          <div class="menu-info"><div class="menu-date">10/12 (一)</div><div class="menu-title">冬柏海景與尾浦散策</div></div>
          <i class="ph-bold ph-caret-right menu-arrow"></i>
        </div>
        <div class="menu-card" onclick="openDay('d4')">
          <div class="menu-icon"><i class="ph-fill ph-leaf"></i></div>
          <div class="menu-info"><div class="menu-date">10/13 (二)</div><div class="menu-title">慶州千年古都與花海</div></div>
          <i class="ph-bold ph-caret-right menu-arrow"></i>
        </div>
        <div class="menu-card" onclick="openDay('d5')">
          <div class="menu-icon"><i class="ph-fill ph-fish-simple"></i></div>
          <div class="menu-info"><div class="menu-date">10/14 (三)</div><div class="menu-title">松葉蟹與披薩夜市大滿貫</div></div>
          <i class="ph-bold ph-caret-right menu-arrow"></i>
        </div>
        <div class="menu-card" onclick="openDay('d6')">
          <div class="menu-icon"><i class="ph-fill ph-airplane-takeoff"></i></div>
          <div class="menu-info"><div class="menu-date">10/15 (四)</div><div class="menu-title">釜山塔、味讚王烤肉賦歸</div></div>
          <i class="ph-bold ph-caret-right menu-arrow"></i>
        </div>
      </div>

      <div class="section-title"><i class="ph-bold ph-shopping-bag-open"></i> 專屬清單</div>
      <div class="home-menu">
        <div class="menu-card buy" onclick="openShopping()">
          <div class="menu-icon"><i class="ph-fill ph-gift"></i></div>
          <div class="menu-info"><div class="menu-date">隨身掃貨記帳</div><div class="menu-title">必買伴手禮清單</div></div>
          <i class="ph-bold ph-caret-right menu-arrow"></i>
        </div>
      </div>
    </div>

    <!-- ================= 行程列表頁 ================= -->
    <div id="page-list" class="page">
      <div class="header-bar">
        <div class="back-btn" onclick="goHome()"><i class="ph-bold ph-arrow-left"></i></div>
        <h2 class="header-title" id="list-header-title">Day 1</h2>
      </div>
      <div class="list-container">
        <div id="listAlert" class="alert-card" style="display:none;"></div>
        <div id="listContent" class="timeline"></div>
      </div>
    </div>

    <!-- ================= 購物清單頁 (單一大清單 + 圖片) ================= -->
    <div id="page-shopping" class="page">
      <div class="header-bar">
        <div class="back-btn" onclick="goHome()"><i class="ph-bold ph-arrow-left"></i></div>
        <h2 class="header-title">🛒 必買伴手禮與美妝清單</h2>
      </div>
      <div class="list-container">
        <div class="alert-card">
          <i class="ph-fill ph-warning-circle alert-icon"></i>
          <div class="alert-text">💡 <b>隨時新增想買的商品</b>，可自由貼上網路上商品的圖片網址，方便逛街比對！</div>
        </div>
        
        <!-- 新增商品區塊 -->
        <div class="add-box">
          <input type="text" id="itemName" class="add-input" placeholder="輸入商品名稱（例如：安城湯麵、KATE粉底液）...">
          <input type="text" id="itemImg" class="add-input" placeholder="貼上商品圖片網址 (選填，可不填)...">
          <button class="add-btn" onclick="addShopItem()">✨ 新增至掃貨清單</button>
        </div>

        <!-- 混合大清單顯示區 -->
        <div class="single-shop-card">
          <h3><i class="ph-fill ph-basket"></i> 欲購買商品總覽</h3>
          <div id="shoppingContainer" class="shopping-item-grid"></div>
        </div>
      </div>
    </div>

    <!-- ================= 詳情頁 ================= -->
    <div id="page-detail" class="page">
      <div class="detail-back-icon" onclick="goBackToList()"><i class="ph-bold ph-arrow-left"></i></div>
      <img id="detail-img" class="detail-cover" src="" alt="Cover">
      <div class="detail-body">
        <div id="detail-tag" class="d-tag">標籤</div>
        <h2 id="detail-title" class="d-title">標題</h2>
        <div id="detail-desc" class="d-desc">內容介紹</div>
        <div id="detail-actions" class="action-row"></div>
      </div>
    </div>

  </div>

  <div id="toast"><i class="ph-fill ph-check-circle"></i><span id="toastMsg">已複製</span></div>

      alertBox.style.display = 'none'; 
    }

    const container = document.getElementById('listContent');
    container.innerHTML = '';
    
    data.items.forEach((item, index) => {
      const typeCfg = typeMap[item.type] || typeMap.traffic;
      const isTask = item.type === 'task' ? 'task' : '';
      const clickable = (item.img || item.desc || item.kr || item.map || item.web) ? `onclick="openDetail('${id}', ${index})"` : '';

      const html = `
        <div class="t-item">
          <div class="t-dot" style="border-color: ${typeCfg.color}"></div>
          <div class="t-card ${isTask}" ${clickable}>
            <div class="t-time" style="color: ${typeCfg.color}">${item.time}</div>
            <div class="t-info"><div class="t-title">${item.title}</div><div class="t-sub">${item.sub}</div></div>
            ${clickable ? '<i class="ph-bold ph-caret-right" style="color:#d6d3d1;"></i>' : ''}
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', html);
    });

    switchPage('page-list');
  }

  function openDetail(dayId, itemIndex) {
    const item = db[dayId].items[itemIndex];
    const typeCfg = typeMap[item.type] || typeMap.traffic;

    const imgEl = document.getElementById('detail-img');
    if(item.img) { imgEl.src = item.img; imgEl.style.display = 'block'; } else { imgEl.style.display = 'none'; }

    const tagEl = document.getElementById('detail-tag');
    tagEl.innerText = typeCfg.label; 
    tagEl.style.backgroundColor = typeCfg.bg; 
    tagEl.style.color = typeCfg.color;

    document.getElementById('detail-title').innerText = item.title;
    document.getElementById('detail-desc').innerHTML = item.desc || '';

    const actionsBox = document.getElementById('detail-actions');
    actionsBox.innerHTML = '';
    if(item.web) actionsBox.innerHTML += `<a href="${item.web}" target="_blank" class="btn-large btn-web"><i class="ph-fill ph-globe"></i> 官方無人機秀資訊網站</a>`;
    if(item.map) actionsBox.innerHTML += `<a href="${item.map}" target="_blank" class="btn-large btn-nav"><i class="ph-fill ph-map-pin"></i> 開啟 NAVER 導航</a>`;
    if(item.kr) actionsBox.innerHTML += `<button class="btn-large btn-cp" onclick="copyText('${item.kr}')"><i class="ph-bold ph-copy"></i> 複製韓文：${item.kr}</button>`;

    switchPage('page-detail');
  }

  function openShopping() {
    renderShopping();
    switchPage('page-shopping');
  }

  function renderShopping() {
    const container = document.getElementById('shoppingContainer');
    let html = '';

    if (shoppingItems.length === 0) {
      html = `<div style="text-align:center; color:var(--text-muted); font-size:0.9rem; padding:20px;">目前沒有商品，快在上方新增吧！</div>`;
    } else {
      shoppingItems.forEach((item, idx) => {
        const thumbHtml = item.img ? `<img src="${item.img}" class="shop-item-thumb" alt="img">` : `<div class="shop-item-thumb" style="display:flex;align-items:center;justify-content:center;color:#a8a29e;"><i class="ph-fill ph-image"></i></div>`;
        html += `
          <div class="shop-item-row">
            <div class="shop-item-info">
              ${thumbHtml}
              <div class="shop-item-name">${item.name}</div>
            </div>
            <button class="shop-item-delete" onclick="deleteShopItem(${idx})"><i class="ph-bold ph-trash"></i></button>
          </div>
        `;
      });
    }

    container.innerHTML = html;
  }

  function addShopItem() {
    const nameInput = document.getElementById('itemName');
    const imgInput = document.getElementById('itemImg');
    const nameVal = nameInput.value.trim();
    const imgVal = imgInput.value.trim();

    if(!nameVal) return;

    shoppingItems.push({ name: nameVal, img: imgVal });
    nameInput.value = '';
    imgInput.value = '';

    localStorage.setItem('busan_single_shopping_list', JSON.stringify(shoppingItems));
    renderShopping();
  }

  function deleteShopItem(idx) {
    shoppingItems.splice(idx, 1);
    localStorage.setItem('busan_single_shopping_list', JSON.stringify(shoppingItems));
    renderShopping();
  }

  let currentDayId = '';
  function switchPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0,0);
  }

  function goHome() { switchPage('page-home'); }
  function goBackToList() { openDay(currentDayId); }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = `已複製：${text}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });
  }
</script>
</body>
</html>
